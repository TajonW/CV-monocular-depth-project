# CPU StereoSGBM parameters matched to the validated single-scene baseline.
dataset_root: data/middlebury/MiddEval3/trainingQ
output_dir: outputs/stereo
method: StereoSGBM
grayscale: true
min_disparity: 0
# Read each scene's calib.txt ndisp, then round up to a multiple of 16.
num_disparities: auto_from_calibration
block_size: 5
# P1 = p1_factor * channels * block_size^2; likewise for P2.
p1_factor: 8
p2_factor: 32
uniqueness_ratio: 10
speckle_window_size: 100
speckle_range: 2
mode: SGBM_3WAY
disp12_max_diff: 1
pre_filter_cap: 31
